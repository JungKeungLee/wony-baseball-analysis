<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/demo/styles.css"><title>WONY 대시보드</title></head><body><header><a class="brand" href="/demo/">WONY · BASEBALL</a><nav class="main-nav" aria-label="메인 메뉴"><a href="/demo/">대시보드</a><a href="/demo/broadcast/">방송 분석</a><a href="/demo/analyses/">분석 기록</a></nav></header><main><section class="intro"><div><p class="eyebrow">BASEBALL ANALYSIS</p><h1>야구를 보고, 한 리포트로.</h1><p>방송 구간을 찾거나 짧은 영상을 분석한 뒤 통합 리포트에서 확인하세요.</p></div></section><div class="report-feedback"><article><h2>방송 분석</h2><p>LIVE 감시 · VOD 정확/대략/전체 탐색</p><a href="/demo/broadcast/">방송 분석 시작 →</a></article><article><h2>분석 기록</h2><p>날짜별 기록과 기존 리포트</p><a href="/demo/analyses/">분석 기록 보기 →</a></article></div><section class="report-section"><h2>짧은 영상 분석</h2><p>최대 60초 · 100 MiB. 완료 후 하나의 통합 리포트로 이동합니다.</p><div class="player-settings"><label>영상 <input id="quick-video" type="file" accept="video/*"></label><label>역할 <select id="quick-role"><option value="batter">타자</option><option value="defense">수비</option><option value="catcher">포수</option><option value="pitcher">투수</option><option value="baserunning">주루</option><option value="auto">미확인 자동</option></select></label><label>선수 ID <input id="quick-player" maxlength="64"></label><label>분석 날짜 <input id="quick-date" type="date"></label><label>비교 조건 <input id="quick-context" maxlength="80"></label><label>송구/투구 팔 <select id="quick-hand"><option value="right">오른팔</option><option value="left">왼팔</option></select></label><label>수비 포지션 <select id="quick-position"><option value="auto">미지정</option><option value="infielder">내야</option><option value="outfielder">외야</option></select></label></div><button id="quick-analyze">영상 분석</button> <button id="quick-demo">DEMO 합성 예시</button><p id="quick-status" role="status"></p></section><section class="report-section"><h2>최근 분석</h2><div id="recent-records"></div></section></main><script type="module" src="/demo/dashboard.js"></script></body></html>
