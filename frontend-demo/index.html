<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8FF">
  <meta name="description" content="리듬에 맞춰 눌러보는 가벼운 4레인 리듬게임">
  <title>WONY RHYTHM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231976D2%22/%3E%3Crect x=%2210%22 y=%2220%22 width=%2210%22 height=%2224%22 rx=%224%22 fill=%22%23fff%22/%3E%3Crect x=%2227%22 y=%2212%22 width=%2210%22 height=%2240%22 rx=%224%22 fill=%22%23FFC93C%22/%3E%3Crect x=%2244%22 y=%2224%22 width=%2210%22 height=%2216%22 rx=%224%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body data-page="home">
  <main class="page">
    <div class="wallet-bar"><span class="wallet-badge" id="walletBadge" hidden>🐟 츄르 0</span></div>
    <header class="home-hero">
      <div class="logo-notes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1 class="logo">WONY <span>RHYTHM</span></h1>
      <p class="tagline">리듬에 맞춰 눌러보세요 🎵</p>
    </header>
    <!-- 워니 안내 (흐름 안의 요소: 메뉴를 가리지 않음, 문구는 js/wony-lines.js) -->
    <div class="wony wony-home" id="homeWony" hidden></div>

    <!-- WONY PHONE 회원 로그인 상태 (이 화면은 로그인 회원만 열림) -->
    <section class="card online-card" id="onlineCard" hidden aria-live="polite">
      <p class="online-text" id="onlineText"></p>
      <div class="online-actions">
        <button type="button" class="btn" id="logoutBtn" hidden>로그아웃</button>
      </div>
    </section>

    <nav class="menu" aria-label="메인 메뉴">
      <a class="menu-item is-primary" id="playLink" href="/songs">
        <span class="menu-icon" aria-hidden="true">▶</span>
        <span>게임 시작<small id="playHint">곡 선택</small></span>
      </a>
      <a class="menu-item" href="/songs">
        <span class="menu-icon" aria-hidden="true">🎵</span>
        <span>곡 선택<small>곡과 난이도 고르기</small></span>
      </a>
      <a class="menu-item" href="/ranking">
        <span class="menu-icon" aria-hidden="true">🏆</span>
        <span>랭킹<small>곡·난이도별 온라인 순위</small></span>
      </a>
      <a class="menu-item" href="/shop">
        <span class="menu-icon" aria-hidden="true">🎨</span>
        <span>스킨 상점<small>준비 중</small></span>
      </a>
      <a class="menu-item" href="/scores">
        <span class="menu-icon" aria-hidden="true">📈</span>
        <span>최고 기록<small>내 곡·난이도별 기록</small></span>
      </a>
      <a class="menu-item" href="/settings">
        <span class="menu-icon" aria-hidden="true">⚙️</span>
        <span>설정<small id="keysHint">← ↓ ↑ →</small></span>
      </a>
    </nav>

    <p class="footer-note">PC는 키보드, 모바일은 화면 아래 버튼으로 플레이해요.</p>
  </main>
</body>
</html>
