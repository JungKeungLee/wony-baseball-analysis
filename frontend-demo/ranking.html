<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8FF">
  <title>랭킹 · WONY RHYTHM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231976D2%22/%3E%3Crect x=%2210%22 y=%2220%22 width=%2210%22 height=%2224%22 rx=%224%22 fill=%22%23fff%22/%3E%3Crect x=%2227%22 y=%2212%22 width=%2210%22 height=%2240%22 rx=%224%22 fill=%22%23FFC93C%22/%3E%3Crect x=%2244%22 y=%2224%22 width=%2210%22 height=%2216%22 rx=%224%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/ranking-page.js"></script>
</head>
<body data-page="ranking">
  <main class="page">
    <header class="topbar">
      <a class="icon-link" href="/" aria-label="홈으로">←</a>
      <h1>🏆 랭킹</h1>
      <span class="wallet-badge" id="walletBadge" hidden>🐟 츄르 0</span>
    </header>
    <div class="stack">
      <section class="card stack" aria-label="곡과 난이도">
        <div class="ranking-filters">
          <select id="songSelect" aria-label="곡"></select>
          <select id="diffSelect" aria-label="난이도"></select>
          <select id="keySelect" aria-label="KEY 모드"></select>
        </div>
        <p class="muted" style="margin:0;font-size:.85rem">정상 CLEAR 기록만 반영돼요 (GAME OVER · NO FAIL · 자동 플레이 제외). KEY 모드별로 따로, 배속은 구분하지 않아요.</p>
      </section>
      <section class="card" aria-live="polite">
        <p class="status" id="rankingStatus" role="status">랭킹을 불러오는 중…</p>
        <div id="rankingBody"></div>
      </section>
      <a class="btn btn-block" href="/">뒤로가기</a>
    </div>
  </main>
</body>
</html>
