  <meta name="robots" content="noindex">
  <title>로그인 필요 · WONY RHYTHM</title>

<!-- 유효한 WONY RHYTHM 로그인 세션이 없을 때 서버가 모든 게임 화면 대신 이 화면을 보낸다 -->
<body data-page="login">
  <main class="page">
    <header class="home-hero">
      <div class="logo-notes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1 class="logo">WONY <span>RHYTHM</span></h1>
    </header>
    <section class="card login-card" aria-labelledby="loginTitle">
      <h2 id="loginTitle">로그인이 필요한 서비스입니다.</h2>
      <p>WONY PHONE에 로그인한 뒤<br>리듬게임을 이용해주세요.</p>
      <p class="status is-error" id="loginMessage" role="status" hidden></p>
      <a class="btn btn-primary btn-block" id="phoneLink" href="__WONY_PHONE_URL__" data-phone-url="__WONY_PHONE_URL__">WONY PHONE으로 이동</a>
      <p class="muted" id="phoneMissing" hidden>WONY PHONE 주소가 아직 설정되지 않았어요. WONY PHONE 앱에서 리듬게임을 열어주세요.</p>
    </section>
  </main>
</body>
</html>
