<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F8FF">
  <title>스킨 상점 · WONY RHYTHM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231976D2%22/%3E%3Crect x=%2210%22 y=%2220%22 width=%2210%22 height=%2224%22 rx=%224%22 fill=%22%23fff%22/%3E%3Crect x=%2227%22 y=%2212%22 width=%2210%22 height=%2240%22 rx=%224%22 fill=%22%23FFC93C%22/%3E%3Crect x=%2244%22 y=%2224%22 width=%2210%22 height=%2216%22 rx=%224%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/shop.js"></script>
</head>
<body data-page="shop">
  <main class="page">
    <header class="topbar">
      <a class="icon-link" href="/" aria-label="홈으로">←</a>
      <h1>🎨 스킨 상점</h1>
      <span class="wallet-badge" id="walletBadge" hidden>🐟 츄르 0</span>
    </header>
    <div class="stack">
      <!-- 판매 시작 전: 상품 · 구매 버튼 없음 (config.js SHOP_OPEN = false) -->
      <section class="card coming-soon" id="shopSoon" aria-labelledby="soonTitle">
        <div class="soon-icon" aria-hidden="true">🎨</div>
        <h2 id="soonTitle">스킨 상점은 준비 중입니다.</h2>
        <p>다양한 UI 스킨과 리듬 바 스킨이 추가될 예정입니다.</p>
        <span class="soon-tag">Coming Soon ✨</span>
      </section>
      <a class="btn btn-block" id="shopBack" href="/">뒤로가기</a>
    </div>
  </main>
</body>
</html>
