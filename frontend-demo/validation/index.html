<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/demo/styles.css"><title>WONY 수동 대상 검증</title></head><body><header><a class="brand" href="/demo/">WONY · ANALYSIS</a><nav class="main-nav"><a href="/demo/">대시보드</a><a href="/demo/broadcast/">방송 분석</a><a href="/demo/analyses/">분석 기록</a></nav></header><main><h1>WONY 수동 대상 검증 <span class="demo-flag">실제 영상 · 실험적 기능</span></h1><p>120초·128 MiB 이하 파일을 선택하세요. 장면을 일시정지하고 WONY 전체가 들어가는 사각형을 그립니다. 다른 인물을 함께 포함하지 마세요.</p><input id="validation-file" type="file" accept="video/*"><video id="selection-video" controls playsinline style="width:100%;max-height:430px"></video><button id="capture-selection" disabled>현재 장면에서 WONY 지정</button><canvas id="selection-canvas" style="width:100%;height:auto;touch-action:none;border:1px solid #40535b" hidden></canvas><p id="selection-description"></p><label>이 장면 시점 <select id="selection-viewpoint"><option value="unknown">확인 필요</option><option value="third_person">3인칭 · 아바타가 보임</option><option value="first_person">1인칭 · 전신 분석 안 함</option></select></label><label>Pose ROI 여유 <input id="pose-margin" type="number" min="0" max="0.5" step="0.05" value="0.2"> (0.2 = 각 방향 20%)</label><label>역할 보조 입력 <select id="role-hint"><option value="auto">자동 추정</option><option value="pitcher">투수</option><option value="batter">타자</option><option value="defense">수비</option><option value="catcher">포수</option><option value="baserunning">주루</option></select></label><label><input id="confirm-target" type="checkbox">지정한 대상이 WONY임을 확인했습니다</label><p class="hint">자동 아바타 인식이 아닙니다. 추적 손실 후 다른 대상을 선택하지 않습니다. 가림·유사 외형·추적 drift는 아직 검증되지 않았습니다.</p><button id="validate-target" disabled>대상 ROI 검증</button><button id="download-selection" disabled>선택 정보 저장</button><p id="validation-status" role="status"></p><p>실험 결과는 정식 선수 성장 이력에 자동 등록하지 않습니다. 아바타의 3D 표현·영상 대리 지표가 실제 생체역학 측정은 아닙니다.</p></main><script type="module" src="/demo/validation/selection.js"></script></body></html>
